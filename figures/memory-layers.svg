   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Source Sans 3'; text-anchor: start; fill: #2667a5" x="34.639087" y="136.96232" transform="rotate(-0 34.639087 136.96232)">Последнее занятие</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(34.639087 152.379141)">Сводка завершённого</text>
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(34.639087 167.695059)">сеанса, 1 занятие</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Source Sans 3'; text-anchor: start; fill: #087f8c" x="180.356173" y="136.96232" transform="rotate(-0 180.356173 136.96232)">Скользящая память</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(180.356173 152.387578)">Недавние занятия</text>
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(180.356173 168.792638)">Окно 7 занятий</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Source Sans 3'; text-anchor: start; fill: #c88918" x="326.07326" y="136.96232" transform="rotate(-0 326.07326 136.96232)">Архив источников</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(326.07326 152.239219)">Исходные реплики</text>
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(326.07326 167.870841)">и их идентификаторы</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Source Sans 3'; text-anchor: start; fill: #2667a5" x="34.639087" y="246.30584" transform="rotate(-0 34.639087 246.30584)">Вопрос пользователя</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(34.639087 261.564458)">Что нужно вспомнить</text>
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(34.639087 277.061079)">о занятиях и ученике?</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Source Sans 3'; text-anchor: start; fill: #087f8c" x="180.356173" y="246.30584" transform="rotate(-0 180.356173 246.30584)">Гибридное извлечение по запросу</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(180.356173 261.91602)">Лексический + векторный поиск → отбор источников</text>
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(180.356173 277.267798)">Графовые связи – дополнительный канал, если включён</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Source Sans 3'; text-anchor: start; fill: #2667a5" x="180.356173" y="324.80888" transform="rotate(-0 180.356173 324.80888)">Ответ с опорой на источники</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(180.356173 340.139919)">Факты + ссылки на реплики. Данных недостаточно –</text>
    <text style="font-size: 9px; font-family: 'Source Sans 3'; fill: #172b3a" transform="translate(180.356173 355.79826)">обоснованная неопределённость.</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 9px; font-family: 'Source Sans 3'; text-anchor: start; fill: #087f8c" x="18.708661" y="19.836" transform="rotate(-0 18.708661 19.836)">КАК УСТРОЕНА ПАМЯТЬ</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 17px; font-family: 'Source Sans 3'; text-anchor: start; fill: #172b3a" x="18.708661" y="45.02" transform="rotate(-0 18.708661 45.02)">От урока к проверяемому ответу</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'Source Sans 3'; text-anchor: start; fill: #5c6f7b" x="18.708661" y="76.084" transform="rotate(-0 18.708661 76.084)">Концептуальная схема слоёв памяти и извлечения</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'Source Sans 3'; text-anchor: start; fill: #172b3a" x="18.708661" y="394.2144" transform="rotate(-0 18.708661 394.2144)">Архив сохраняет основание для проверки. Резюме помогает удерживать контекст.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'Source Sans 3'; text-anchor: start; fill: #5c6f7b" x="18.708661" y="412.056" transform="rotate(-0 18.708661 412.056)">Окна 1 / 7 иллюстрируют сводки памяти. Результаты пяти режимов показаны отдельно.</text>
  </g>
 </g>
